<!doctype html>
<meta charset="utf-8">
<title>Hair by Chrissy</title>
<!--
  A safety net, not part of the site.

  The site itself is public/, published by .github/workflows/pages.yml with
  GitHub Actions as the Pages source. This file is NOT in that artifact and is
  never served when things are set up correctly.

  It exists for when they are not. If the Pages source is ever set back to
  "Deploy from a branch", GitHub builds the REPOSITORY ROOT with Jekyll — and
  a root with no index.html gets README.md rendered as the home page. That is
  the "why am I looking at the README" bug: two publishers, one site, and
  whichever ran last wins.

  Fix the source (Settings -> Pages -> Build and deployment -> Source:
  "GitHub Actions"), and this file goes back to doing nothing. Until then it
  sends visitors to the real site instead of a technical document.

  The redirect is relative on purpose: under a branch build the site root is
  the repo root, so the real site sits at ./public/.
-->
<meta http-equiv="refresh" content="0; url=./public/">
<link rel="canonical" href="https://hairbychrissy.ysbdesigns.uk/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #f7f2ea; color: #33261c;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: #33261c; }
</style>
<body>
  <p>Taking you to <a href="./public/">Hair by Chrissy</a>&hellip;</p>
  <script>location.replace('./public/');</script>
</body>
