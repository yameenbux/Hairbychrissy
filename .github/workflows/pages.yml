# Publishes the client site to GitHub Pages.
#
# ONE SETTING IS REQUIRED, once:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# THIS IS NOT OPTIONAL, and getting it wrong has a confusing symptom. With the
# source set to "Deploy from a branch", GitHub ALSO runs its own Jekyll build
# ("pages-build-deployment") over the REPOSITORY ROOT. The root has no
# index.html, and Jekyll falls back to rendering README.md as the home page —
# so visitors intermittently get a technical document instead of the site,
# depending on which of the two publishers deployed last.
#
# If that happens, check Actions for runs of "pages-build-deployment". Any at
# all means the source is still set to a branch.
#
# With it set correctly, every push to the branch below republishes the site.
# Nothing else is needed — no gh-pages branch, no /docs folder.
#
# The custom domain lives at public/CNAME, because this workflow publishes
# public/ and nothing outside it. The CNAME at the repository root is only
# read by the Jekyll build above, so relying on that one would drop the domain
# on every deploy from here.
#
# What gets published is public/ — the same files the Node app serves, so the
# two never drift. The booking API cannot run on Pages, so the published page
# falls back to public/data/site.json and routes bookings to an enquiry. Point
# it at a hosted API by setting the HBC_API repository variable.

name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/beauty-booking-platform-ppwhet
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the content snapshot so the published page can never drift
      # from lib/seed.js.
      - name: Build static content snapshot
        run: node tools/build-static-data.js

      # Optional: point the published page at a hosted booking API so the live
      # calendar works from Pages. Set the HBC_API repository variable to the
      # API's base URL. Without it the page runs in enquiry mode.
      - name: Point at hosted booking API
        if: ${{ vars.HBC_API != '' }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          api = os.environ['HBC_API'].rstrip('/')
          tag = f'<meta name="hbc-api" content="{api}">'
          # book.html matters most of the three: it carries the calendar.
          # Leaving it out would point the home page at the live API while the
          # booking page itself stayed in enquiry mode.
          # Every page that talks to the API. confirmed.html and pay-demo.html
          # look up a booking, so they need the base too — they were missed
          # while their fetches were still root-absolute.
          for name in ('index.html', 'book.html', 'confirmed.html', 'pay-demo.html'):
              p = pathlib.Path('public') / name
              if not p.exists():
                  continue
              html = p.read_text()
              if 'name="hbc-api"' not in html:
                  html = html.replace('</head>', f'{tag}\n</head>', 1)
                  p.write_text(html)
                  print(f'{name}: pointed at {api}')
          PY
        env:
          HBC_API: ${{ vars.HBC_API }}

      # Say which of the two sites was just built.
      #
      # Without this the difference is invisible: the API step is skipped when
      # HBC_API is unset, every other step succeeds, and a green tick publishes
      # a site that cannot take a booking. That is how the calendar stayed in
      # enquiry mode with nothing anywhere reporting a problem.
      - name: Report what was published
        run: |
          if [ -n "${HBC_API}" ]; then
            missing=""
            for f in index.html book.html confirmed.html pay-demo.html; do
              grep -q 'name="hbc-api"' "public/$f" || missing="$missing $f"
            done
            if [ -n "$missing" ]; then
              echo "::error::HBC_API is set but the tag did not reach:$missing"
              exit 1
            fi
            echo "### Published with LIVE BOOKING" >> "$GITHUB_STEP_SUMMARY"
            echo "Calendar talks to \`${HBC_API}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "==> LIVE BOOKING against ${HBC_API}"
          else
            echo "### Published in ENQUIRY MODE" >> "$GITHUB_STEP_SUMMARY"
            echo "No booking API is configured, so the calendar is not shown and visitors are asked to message instead." >> "$GITHUB_STEP_SUMMARY"
            echo "To switch it on: **Settings -> Secrets and variables -> Actions -> Variables**, add \`HBC_API\` with the API's base URL, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "==> ENQUIRY MODE — no HBC_API variable set, so the site cannot take bookings"
          fi
        env:
          HBC_API: ${{ vars.HBC_API }}

      # Jekyll would otherwise skip files and folders beginning with an
      # underscore.
      - name: Disable Jekyll processing
        run: touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
